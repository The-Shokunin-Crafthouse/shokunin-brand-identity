<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Color · Mobile — three nav patterns</title>
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="system/mark-icon-light.svg">
<link rel="stylesheet" href="system/colors_and_type.css">
<link rel="stylesheet" href="system/_components.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--sc-color-surface-page); }
  body {
    font-family: var(--sc-p-font-family-text);
    color: var(--sc-color-text-primary);
  }
  #root { width: 100%; height: 100vh; }

  /* Each artboard contains a phone shell with iframe inside */
  .phone {
    width: 390px;
    height: 844px;
    background: var(--sc-color-surface-page);
    border-radius: 44px;
    border: 1px solid var(--sc-color-border-default);
    overflow: hidden;
    position: relative;
    box-shadow: 0 1px 2px rgba(13,12,11,0.04), 0 12px 32px rgba(13,12,11,0.06);
  }
  .phone iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .phone::before {
    /* dynamic island */
    content: "";
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 36px;
    background: #0D0C0B;
    border-radius: 9999px;
    z-index: 50;
    pointer-events: none;
  }

  /* Pattern caption above each phone */
  .caption {
    width: 390px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .caption .ord {
    font: var(--sc-t-mono-chrome);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sc-color-text-disabled);
  }
  .caption .ord b { color: var(--sc-color-brand-accent); margin-right: 6px; }
  .caption .name {
    font: var(--sc-p-font-weight-light) 28px/1.1 var(--sc-p-font-family-display);
    letter-spacing: -0.015em;
    color: var(--sc-color-text-primary);
  }
  .caption .blurb {
    font: var(--sc-p-font-weight-regular) 13px/1.5 var(--sc-p-font-family-text);
    color: var(--sc-color-text-secondary);
    max-width: 360px;
    text-wrap: pretty;
  }

  /* Spec ticks below each phone */
  .ticks {
    width: 390px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--sc-color-border-default);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font: var(--sc-t-mono-chrome);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sc-color-text-disabled);
  }
  .ticks .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .ticks .row b {
    color: var(--sc-color-text-secondary);
    font-weight: var(--sc-p-font-weight-medium);
  }

  .wrap-artboard {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function PhoneArtboard({ navParam, ord, name, blurb, ticks }) {
  return (
    <div className="wrap-artboard">
      <div className="caption">
        <div className="ord"><b>{ord}</b>Navigation pattern</div>
        <div className="name">{name}</div>
        <div className="blurb">{blurb}</div>
      </div>
      <div className="phone">
        <iframe src={`mobile/Color-Mobile.html?nav=${navParam}`} title={name}></iframe>
      </div>
      <div className="ticks">
        {ticks.map(([k, v], i) => (
          <div className="row" key={i}><span><b>{k}</b></span><span>{v}</span></div>
        ))}
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="color-mobile"
        title="Color · mobile · three navigation patterns"
        subtitle="390px · iOS · same body, three nav surfaces. Drag to reorder. Click any phone to focus."
      >
        <DCArtboard id="drawer" label="A · Drawer" width={390} height={1140}>
          <PhoneArtboard
            navParam="drawer"
            ord="A"
            name="Drawer"
            blurb="A 52px top bar with a hamburger and the breadcrumb. Tap opens a full-height drawer that mirrors the desktop sidebar — Foundations, Components, Voice, theme switch. The safe, conventional read."
            ticks={[
              ["Surface", "top bar 52px · drawer 326px"],
              ["Discovery", "hamburger affordance"],
              ["Reach", "top-left · two-handed"],
              ["Trade-off", "hides hierarchy until opened"],
            ]}
          />
        </DCArtboard>

        <DCArtboard id="sheet" label="B · Section sheet" width={390} height={1140}>
          <PhoneArtboard
            navParam="sheet"
            ord="B"
            name="Section sheet"
            blurb="A 44px crumb-only top bar. A bottom-anchored pill shows the current chapter as you scroll. Tap raises a half-sheet with the full index — chapters and pages, toggled by a segmented control."
            ticks={[
              ["Surface", "bottom dock 56px · sheet 80vh"],
              ["Discovery", "always visible context"],
              ["Reach", "bottom-center · thumb"],
              ["Trade-off", "covers content area"],
            ]}
          />
        </DCArtboard>

        <DCArtboard id="rail" label="C · Stepper rail" width={390} height={1140}>
          <PhoneArtboard
            navParam="rail"
            ord="C"
            name="Stepper rail"
            blurb="A persistent 40px left rail of chapter ordinals — i ii iii iv v — with shu marking the current. Top chevron drops a page index. The page reads as a numbered editorial spread, not an app screen."
            ticks={[
              ["Surface", "rail 40px · top bar 44px"],
              ["Discovery", "always visible · ordinal anchor"],
              ["Reach", "left edge · two-handed scroll"],
              ["Trade-off", "narrows the content column"],
            ]}
          />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
