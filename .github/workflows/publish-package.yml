name: Publish SCDS package

# Publishes @the-shokunin-crafthouse/scds to GitHub Packages on a version tag,
# then tells every consumer repo a new version exists.
#
# Release flow:
#   npm version minor        # bumps package.json + creates the v* tag
#   git push --follow-tags   # this workflow fires on the tag
#
# GITHUB_TOKEN can publish to GitHub Packages inside the same org (packages:
# write below), so publishing needs no PAT. The cross-repo dispatch DOES —
# GITHUB_TOKEN cannot fire a repository_dispatch at another repo.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@the-shokunin-crafthouse'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Fail if the tag does not match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG." >&2
            echo "Use \`npm version\` so the two are created together." >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-consumers:
    needs: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      # Credentials come from the SCDS Dispatch GitHub App — org-scoped, minted
      # per run, ~1h life. `owner:` is required: without it the token scopes to
      # THIS repo, which is deliberately not an App installation target.
      #
      # continue-on-error because the package is already published by the time
      # this job runs. A credential problem must not turn a good release red —
      # the next step detects the empty token and warns.
      - name: Mint App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCDS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SCDS_DISPATCH_APP_KEY }}
          owner: The-Shokunin-Crafthouse

      - name: Notify consumer repos of the new version
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No App token minted — consumers were NOT notified."
            echo "Check vars.SCDS_DISPATCH_APP_ID and secrets.SCDS_DISPATCH_APP_KEY,"
            echo "run dispatch-preflight.yml to diagnose, then re-run this job."
            exit 0
          fi
          for repo in client-portal shokunin-crafthouse-site; do
            echo "dispatching scds-released ($VERSION) -> $repo"
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/The-Shokunin-Crafthouse/$repo/dispatches" \
              -d "{\"event_type\":\"scds-released\",\"client_payload\":{\"version\":\"$VERSION\"}}" \
              || echo "::warning::dispatch to $repo failed"
          done
