name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview directory on Hostinger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: 65002
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            rm -rf ~/domains/shokunincrafthouse.com/public_html/brand/_previews/${{ github.event.pull_request.number }}/

      - name: Comment on PR confirming teardown
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = [
              '### 🧹 Preview torn down',
              '',
              `The preview environment for PR #${issue_number} has been removed from the server.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
