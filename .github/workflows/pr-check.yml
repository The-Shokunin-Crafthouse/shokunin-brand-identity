name: PR Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs before the build so a contrast regression in the token source
      # reports as its own failure rather than being buried in build output.
      - name: Verify token contrast
        run: npm run tokens:verify

      # token-map.md is generated from tokens/*.json. It drifted for ~3 months
      # while hand-maintained, so staleness is a build failure, not a chore.
      - name: Verify token-map is current
        run: npm run tokens:map:check

      # SCDSTokens.swift is generated from the same tokens/*.json. Same reason
      # as the line above: a generated file nothing checks is a to-do wearing a
      # guarantee's costume, and native consumers cannot see a CSS build break.
      - name: Verify SCDSTokens.swift is current
        run: npm run tokens:swift:check

      - name: Build
        run: npm run build
