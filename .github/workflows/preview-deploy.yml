name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Allow the workflow to comment on PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with preview base path
        env:
          BASE_PATH: /_previews/${{ github.event.pull_request.number }}/
        run: npm run build

      - name: Block crawlers on preview
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Ensure preview parent directory exists on Hostinger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: 65002
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            mkdir -p ~/domains/brand.shokunincrafthouse.com/public_html/_previews/${{ github.event.pull_request.number }}/

      - name: Deploy preview to Hostinger via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ~/domains/brand.shokunincrafthouse.com/public_html/_previews/${{ github.event.pull_request.number }}/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: 65002
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Debug — inspect server-side state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: 65002
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "=== home ==="
            echo "HOME=$HOME"
            pwd
            echo "=== ~/domains contents ==="
            ls -la ~/domains/ 2>&1 || echo "no ~/domains dir"
            echo "=== brand subdomain dir ==="
            ls -la ~/domains/brand.shokunincrafthouse.com/ 2>&1 || echo "no brand subdomain dir"
            echo "=== public_html contents ==="
            ls -la ~/domains/brand.shokunincrafthouse.com/public_html/ 2>&1 || echo "no public_html"
            echo "=== _previews ==="
            ls -la ~/domains/brand.shokunincrafthouse.com/public_html/_previews/ 2>&1 || echo "no _previews"
            echo "=== preview ${{ github.event.pull_request.number }} ==="
            ls -la ~/domains/brand.shokunincrafthouse.com/public_html/_previews/${{ github.event.pull_request.number }}/ 2>&1 || echo "no preview dir"
            echo "=== sibling domains under ~/domains ==="
            ls -1 ~/domains/ 2>&1 || true
            echo "=== check primary domain public_html ==="
            ls -la ~/public_html/ 2>&1 | head -20 || echo "no ~/public_html"

      - name: Post or update sticky preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://brand.shokunincrafthouse.com/_previews/${{ github.event.pull_request.number }}/
        with:
          script: |
            const marker = '<!-- sticky-preview-comment -->';
            const previewUrl = process.env.PREVIEW_URL;
            const body = [
              marker,
              '### 🔗 **Preview ready**',
              '',
              `[${previewUrl}](${previewUrl})`,
              '',
              `_Same URL opens on mobile — scan or paste in any browser._`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
