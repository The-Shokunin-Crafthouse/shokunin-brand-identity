name: Manual SSH Cleanup (one-off)

# One-off utility to remove the orphan ~/domains/brand.shokunincrafthouse.com/
# directory created by earlier wrong-path rsyncs. Safe to delete this file
# after the run succeeds.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger and remove orphan directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: 65002
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "=== before ==="
            ls -la ~/domains/brand.shokunincrafthouse.com/ 2>&1 || echo "already gone"
            rm -rf ~/domains/brand.shokunincrafthouse.com/
            echo "=== after ==="
            ls -la ~/domains/ 2>&1
