name: Dispatch preflight

# Answers one question without anyone reading a secret: can the configured
# dispatch credential actually reach each consumer repo?
#
# Run it from the Actions tab (or `gh workflow run dispatch-preflight.yml`).
# It prints a per-repo verdict and fails if any consumer is unreachable, so the
# result is a signal rather than something to go read logs for.
#
# The credential is the SCDS Dispatch GitHub App (app id 4626082): org-scoped,
# minted fresh each run (~1h life, nothing long-lived in a secret), no expiry to
# calendar, and covering a NEW consumer means installing the App on that repo
# rather than editing a credential here. Run this after adding a consumer.
#
# Why the PAT route was abandoned: a fine-grained PAT's repository selection is
# stored by repo id, so the grant did not survive client-portal being deleted
# (2026-06-11) and recreated (2026-06-20). Widening the selection then sent the
# token back to PENDING ORG APPROVAL, and an unapproved fine-grained token
# returns 404 — not 403 — on org repos, so it cannot even see them. This
# workflow is what distinguished those two failures from each other, and from
# the 503s of the 2026-08-17 GitHub outage: read 404 = credential/approval,
# read 200 + write 503 = upstream, read 200 + write 204 = wired.

on:
  workflow_dispatch:
    inputs:
      send_real_dispatch:
        description: 'Fire a real scds-preflight event (default; harmless — no receiver listens for it). Uncheck for an auth-only probe.'
        type: boolean
        default: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error so a mint failure reaches the reporting step below,
      # which explains it, rather than dying with a raw action error.
      - name: Mint App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCDS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SCDS_DISPATCH_APP_KEY }}
          owner: The-Shokunin-Crafthouse

      - name: Report credential state
        env:
          HAS_APP_ID: ${{ vars.SCDS_DISPATCH_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.SCDS_DISPATCH_APP_KEY != '' }}
          APP_MINTED: ${{ steps.app-token.outputs.token != '' }}
        run: |
          echo "SCDS_DISPATCH_APP_ID  set: $HAS_APP_ID"
          echo "SCDS_DISPATCH_APP_KEY set: $HAS_APP_KEY"
          echo "App token minted:          $APP_MINTED"
          echo
          if [ "$APP_MINTED" = "true" ]; then
            echo "SCDS Dispatch App token minted."
            exit 0
          fi
          if [ "$HAS_APP_ID" != "true" ]; then
            echo "::error::vars.SCDS_DISPATCH_APP_ID is not set. Settings -> Secrets and"
            echo "variables -> Actions -> Variables. The App id is on the App's page."
            exit 1
          fi
          if [ "$HAS_APP_KEY" != "true" ]; then
            echo "::error::secrets.SCDS_DISPATCH_APP_KEY is not set or is not visible to"
            echo "this repo. If it is an ORG secret, its repository access must include"
            echo "shokunin-brand-identity."
            exit 1
          fi
          echo "::error::Both inputs are set but no token was minted — the private key is"
          echo "malformed or does not belong to App id $HAS_APP_ID. Re-paste the full PEM,"
          echo "including the BEGIN and END lines."
          exit 1

      - name: List where the App is installed
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # An App token is scoped to the repos the App is installed on. Listing
          # them turns "unreachable" into a specific, actionable cause: a missing
          # installation rather than a missing permission.
          echo "Repositories this App installation can reach:"
          curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/installation/repositories?per_page=100" \
            | jq -r '.repositories[]?.full_name // empty' | sed 's/^/  /' \
            || echo "  (could not list — continuing to the per-repo probe)"

      - name: Test reachability of each consumer repo
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SEND_REAL: ${{ inputs.send_real_dispatch }}
        run: |
          FAILED=0
          for repo in client-portal shokunin-crafthouse-site; do
            echo "──────── $repo ────────"

            READ="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/The-Shokunin-Crafthouse/$repo")"
            echo "  read  (GET /repos)       -> HTTP $READ"

            if [ "$SEND_REAL" = "true" ]; then
              PAYLOAD='{"event_type":"scds-preflight"}'
            else
              # Deliberately missing event_type: exercises auth + permission
              # without delivering an event.
              PAYLOAD='{}'
            fi
            WRITE="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/The-Shokunin-Crafthouse/$repo/dispatches" \
              -d "$PAYLOAD")"
            echo "  write (POST /dispatches) -> HTTP $WRITE"

            case "$WRITE" in
              204)
                echo "  VERDICT: reachable — dispatch delivered." ;;
              400|422)
                echo "  VERDICT: reachable — authorised (payload intentionally rejected in auth-only mode)." ;;
              403)
                echo "  VERDICT: UNREACHABLE — the App lacks Contents: write on this repo."
                echo "           Fix: the App's Contents permission is not Read and write, OR the"
                echo "           installation predates that permission change and needs the new"
                echo "           permission accepted on the org's installation page."
                FAILED=1 ;;
              404)
                echo "  VERDICT: UNREACHABLE — the App is not installed on this repo."
                echo "           Fix: org Settings -> GitHub Apps -> SCDS Dispatch -> Configure ->"
                echo "           add this repository."
                FAILED=1 ;;
              401)
                echo "  VERDICT: UNREACHABLE — App token invalid or expired mid-run."
                FAILED=1 ;;
              502|503|504)
                echo "  VERDICT: INCONCLUSIVE — GitHub returned $WRITE (upstream error, not a"
                echo "           permission problem). Check githubstatus.com and re-run."
                FAILED=1 ;;
              *)
                echo "  VERDICT: UNREACHABLE — unexpected HTTP $WRITE."
                FAILED=1 ;;
            esac
          done

          echo
          if [ "$FAILED" = "1" ]; then
            echo "::error::At least one consumer is unreachable — see the per-repo verdict above for the specific cause and fix."
            exit 1
          fi
          echo "::notice::All consumers reachable — automatic propagation is wired."
