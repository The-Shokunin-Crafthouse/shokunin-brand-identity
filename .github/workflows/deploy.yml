name: Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SSH/rsync from GitHub Actions to Hostinger times out intermittently —
      # retry is the standing studio pattern (the client-portal deploy does the
      # same). A single timeout used to kill the whole deploy.
      - name: Deploy to Hostinger via rsync (with retry)
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 15
          command: |
            KEY="$(mktemp)"
            printf '%s\n' "$HOSTINGER_SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
            rsync -avzr --delete \
              -e "ssh -p 65002 -i $KEY -o StrictHostKeyChecking=accept-new" \
              dist/ \
              "$HOSTINGER_USER@$HOSTINGER_HOST:~/domains/shokunincrafthouse.com/public_html/brand/"
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}

      # Brand → Portal bridge: once the design system is live, tell the client
      # portal its _brand/ submodule moved so it can pull, rebuild, and restart.
      # Receiver: client-portal/.github/workflows/deploy.yml (repository_dispatch
      # type: brand-updated). Needs PORTAL_DISPATCH_TOKEN (a fine-grained PAT) —
      # the built-in GITHUB_TOKEN is scoped to this repo and cannot dispatch out.
      - name: Trigger client-portal rebuild
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
          repository: The-Shokunin-Crafthouse/client-portal
          event-type: brand-updated
