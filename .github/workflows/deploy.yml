name: Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SSH/rsync from GitHub Actions to Hostinger times out intermittently —
      # retry is the standing studio pattern (the client-portal deploy does the
      # same). A single timeout used to kill the whole deploy.
      - name: Deploy to Hostinger via rsync (with retry)
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 15
          command: |
            KEY="$(mktemp)"
            printf '%s\n' "$HOSTINGER_SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
            rsync -avzr --delete --filter='protect _previews/**' \
              -e "ssh -p 65002 -i $KEY -o StrictHostKeyChecking=accept-new" \
              dist/ \
              "$HOSTINGER_USER@$HOSTINGER_HOST:~/domains/brand.shokunincrafthouse.com/public_html/"
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}

      # The brand → portal repository_dispatch bridge lived here until 2026-06.
      # The client-portal repo was deleted ahead of a ground-up rebuild; when the
      # new portal exists, restore the dispatch step (see decisions.md 2026-06-11)
      # with a fresh fine-grained PAT in PORTAL_DISPATCH_TOKEN.
