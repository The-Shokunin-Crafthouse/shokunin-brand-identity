name: Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SSH/rsync from GitHub Actions to Hostinger times out intermittently —
      # retry is the standing studio pattern (the client-portal deploy does the
      # same). A single timeout used to kill the whole deploy.
      - name: Deploy to Hostinger via rsync (with retry)
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 15
          command: |
            KEY="$(mktemp)"
            printf '%s\n' "$HOSTINGER_SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
            rsync -avzr --delete --filter='protect _previews/**' \
              -e "ssh -p 65002 -i $KEY -o StrictHostKeyChecking=accept-new" \
              dist/ \
              "$HOSTINGER_USER@$HOSTINGER_HOST:~/domains/brand.shokunincrafthouse.com/public_html/"
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}

      # Consumer propagation — restored 2026-08-16. The original brand → portal
      # bridge was removed in 2026-06 when client-portal was deleted ahead of a
      # ground-up rebuild; the portal is back, and the studio site is a consumer
      # too, so the bridge now fans out to both.
      #
      # This fires on every main deploy and means "the served tokens.css just
      # changed" — it is the CSS path, for consumers that snapshot the
      # stylesheet at build time. The React component path is versioned instead:
      # publish-package.yml dispatches `scds-released` on a version tag.
      #
      # GITHUB_TOKEN cannot fire a cross-repo dispatch. Credentials come from the
      # SCDS Dispatch GitHub App (app id in vars.SCDS_DISPATCH_APP_ID, signing
      # key in secrets.SCDS_DISPATCH_APP_KEY): org-scoped, minted fresh per run
      # with a ~1h life. Adding a consumer means installing the App on that repo
      # — no credential edit here.
      #
      # `owner:` is required. Without it the action scopes the token to the
      # CURRENT repo, which would need the App installed here too; with it, the
      # token covers the org installation (currently client-portal and
      # shokunin-crafthouse-site — brand is deliberately not installed, since
      # nothing here needs the App's write access).
      #
      # Verified 2026-08-17 via dispatch-preflight.yml: HTTP 204 on both.
      # continue-on-error replaces the `if: vars.… != ''` gate the fallback era
      # relied on: a bad or missing credential must not turn a SUCCESSFUL deploy
      # red. The next step detects the empty token and warns instead.
      - name: Mint App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCDS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SCDS_DISPATCH_APP_KEY }}
          owner: The-Shokunin-Crafthouse

      # Absent credential warns rather than failing the deploy — the deploy
      # itself already succeeded by this point, and failing here would mark good
      # work red.
      - name: Notify consumers that tokens.css changed
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No App token minted — consumers were NOT notified. Check vars.SCDS_DISPATCH_APP_ID and secrets.SCDS_DISPATCH_APP_KEY, then run dispatch-preflight.yml."
            exit 0
          fi
          for repo in client-portal shokunin-crafthouse-site; do
            echo "dispatching brand-tokens-updated -> $repo"
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/The-Shokunin-Crafthouse/$repo/dispatches" \
              -d '{"event_type":"brand-tokens-updated"}' \
              || echo "::warning::dispatch to $repo failed"
          done
